[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbi-kan"
version = "0.1.0"
description = "Spectral Basis Interpretable Unit: A Learned Orthogonal Projection Module for KANs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "efficient-kan @ git+https://github.com/Blealtan/efficient-kan.git"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "isort>=5.12.0",
    "optuna>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]